name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Validate release version
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          # Fail before anything is published if the Trusted Publishing login would fail later.
          if (-not $env:NUGET_USER) { throw 'The repository variable NUGET_USER is not set.' }
          $version = dotnet msbuild src/TdbIO/TdbIO.csproj -getProperty:Version -nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_NAME -cne "v$($version.Trim())") {
            throw "The release tag must match the package version v$($version.Trim())."
          }
      # Before anything is published: a commit without a changelog section for the version fails here.
      - name: Extract release notes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Encoding utf8
          $start = [array]::FindIndex($changelog, [Predicate[string]] { param($line) $line.StartsWith("## [$version]") })
          if ($start -lt 0) { throw "CHANGELOG.md has no entry for $version" }
          $notes = @()
          for ($i = $start + 1; $i -lt $changelog.Count -and -not $changelog[$i].StartsWith('## ['); $i++) { $notes += $changelog[$i] }
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8
      - run: dotnet restore TdbIO.slnx
      - run: dotnet build TdbIO.slnx -c Release --no-restore
      - run: dotnet test TdbIO.slnx -c Release --no-build
      # The script also checks the package dependencies of the scene adapter before anything is pushed.
      - name: Pack release
        shell: pwsh
        run: ./tools/pack-release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*
      # The push comes before the GitHub release: a refused first publication of a package id can be fixed and the
      # job run again, because --skip-duplicate makes the push repeatable and no release exists yet.
      # Trusted publishing: the NuGet policy for this repository and workflow file exchanges the GitHub OIDC token for a short-lived key.
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish NuGet packages
        shell: pwsh
        run: |
          foreach ($package in Get-ChildItem artifacts -Filter *.nupkg) {
            dotnet nuget push $package.FullName --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push failed for $($package.Name) with exit code $LASTEXITCODE" }
          }
      # A release left by an earlier run of the same tag is updated, so a re-run does not fail on creating it.
      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem artifacts -File | ForEach-Object { $_.FullName })
          $tagName = $env:GITHUB_REF_NAME
          # A version with a hyphen is a prerelease.
          $flags = @()
          if ($tagName.Contains('-')) { $flags += '--prerelease' }

          # Only a missing release goes on to create one; any other failure of the lookup (auth, network) stops here.
          $view = gh release view $tagName 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -and $view -notmatch 'release not found') {
            throw "gh release view failed with exit code ${LASTEXITCODE}: $view"
          }
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Updating existing release $tagName..."
            gh release edit $tagName --notes-file release-notes.md @flags
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE" }
            gh release upload $tagName @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
          } else {
            Write-Host "Creating release $tagName..."
            gh release create $tagName --verify-tag --title $tagName --notes-file release-notes.md @flags @files
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }
